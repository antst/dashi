name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install-layouts-linux:
    needs: versions
    uses: ./.github/workflows/install-layouts.yml
    with:
      os: ubuntu-latest

  install-layouts-macos:
    needs: versions
    uses: ./.github/workflows/install-layouts.yml
    with:
      os: macos-latest

  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tested: ${{ steps.versions.outputs.tested }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
      - name: Refuse non-plain or mismatched versions first
        run: node scripts/check-release-version.mjs "$GITHUB_REF_NAME"
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pack and check the annotated tag before any other release job
        run: |
          node scripts/pack-release.mjs "$RUNNER_TEMP/dashi-release-archives"
          node scripts/check-release-payloads.mjs "$GITHUB_REF_NAME" "$RUNNER_TEMP/dashi-release-archives"
      - id: versions
        run: echo "tested=$(node -p 'JSON.stringify(require("./packages/dashi/validated-dsh-versions.json").tested)')" >> "$GITHUB_OUTPUT"

  verify:
    needs: versions
    name: DSH ${{ matrix.dsh }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dsh: ${{ fromJSON(needs.versions.outputs.tested) }}
    env:
      DSH_TEST_VERSION: ${{ matrix.dsh }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm gate:docker

  publish:
    needs: [versions, verify, install-layouts-linux, install-layouts-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify plain release version
        id: release
        run: |
          version="$(node scripts/check-release-version.mjs "$GITHUB_REF_NAME")"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Re-pack and check proven payloads before any gh or npm action
        run: |
          node scripts/pack-release.mjs "$RUNNER_TEMP/dashi-release-archives"
          node scripts/check-release-payloads.mjs "$GITHUB_REF_NAME" "$RUNNER_TEMP/dashi-release-archives"
      - name: Publish the four verified archives to latest
        run: node scripts/publish-release-payloads.mjs "$RUNNER_TEMP/dashi-release-archives"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" > "$RUNNER_TEMP/existing-release.json" 2> "$RUNNER_TEMP/release-query-error.log"; then
            echo "GitHub release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          if ! rg -q '\(HTTP 404\)' "$RUNNER_TEMP/release-query-error.log"; then
            cat "$RUNNER_TEMP/release-query-error.log" >&2
            exit 1
          fi
          notes="$(awk -v heading="## $RELEASE_VERSION" '
            $0 == heading || index($0, heading " ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)"
          args=(release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME")
          if [[ -n "$notes" ]]; then
            printf '%s\n' "$notes" > "$RUNNER_TEMP/release-notes.md"
            args+=(--notes-file "$RUNNER_TEMP/release-notes.md")
          else
            args+=(--generate-notes)
          fi
          gh "${args[@]}"

name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-layouts-linux:
    uses: ./.github/workflows/install-layouts.yml
    with:
      os: ubuntu-latest

  # Keep timing-sensitive PTY gates away from our installation load (W-124).
  install-layouts-macos:
    needs: macos-gate
    uses: ./.github/workflows/install-layouts.yml
    with:
      os: macos-latest

  versions:
    runs-on: ubuntu-latest
    outputs:
      tested: ${{ steps.versions.outputs.tested }}
    steps:
      - uses: actions/checkout@v7
      - id: versions
        run: echo "tested=$(node -p 'JSON.stringify(require("./packages/dashi/validated-dsh-versions.json").tested)')" >> "$GITHUB_OUTPUT"

  gate:
    needs: versions
    name: DSH ${{ matrix.dsh }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dsh: ${{ fromJSON(needs.versions.outputs.tested) }}
    env:
      DSH_TEST_VERSION: ${{ matrix.dsh }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm gate:docker
      # Release hashes are produced only under the supported pack conditions (D-052).
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
      - name: Print release archive hashes
        run: |
          stat -c 'generated output owner: %n uid=%u gid=%g' packages/file-uploads-none/lib packages/dashi/lib
          node scripts/pack-release.mjs "$RUNNER_TEMP/dashi-release-archives"
          node --input-type=module <<'NODE'
          import { join } from 'node:path'
          import { packRelease, readReleaseArchives } from './scripts/pack-release.mjs'
          const first = readReleaseArchives(join(process.env.RUNNER_TEMP, 'dashi-release-archives'))
          for (let index = 1; index < 3; index++) {
            const repeated = packRelease(join(process.env.RUNNER_TEMP, 'dashi-release-repeat-' + index))
            if (repeated.some((payload, position) => payload.sha256 !== first[position].sha256)) {
              throw new Error('Release archives changed between consecutive packs')
            }
          }
          console.log('release pack: PASS — three consecutive complete pack sets byte-identical')
          NODE

  preview:
    needs: [gate, install-layouts-linux]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Publish preview
        run: pnpx pkg-pr-new publish ./packages/file-uploads-none ./packages/dashi ./packages/dashi-app ./packages/dashi-launcher --pnpm --compact

  macos-gate:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install terminal test dependencies
        run: brew install tmux screen
      - run: pnpm install --frozen-lockfile
      - run: pnpm gate

name: W-131 packed-byte diagnosis

on:
  push:
    branches:
      - w-131-pack-bytes-probe

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DSH_TEST_VERSION: 0.2.1-alpha.2
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Record app inputs before the original Docker gate
        run: |
          sha256sum packages/dashi-app/package.json packages/dashi-app/README.md packages/dashi-app/cordis.patch.yml LICENSE
          stat --printf='%n mode=%a uid=%u gid=%g size=%s mtime=%Y\n' packages/dashi-app/package.json packages/dashi-app/README.md packages/dashi-app/cordis.patch.yml LICENSE
      - run: pnpm gate:docker
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
      - name: Reproduce the original post-gate pack and record its inputs
        run: |
          git diff --name-only
          sha256sum packages/dashi-app/package.json packages/dashi-app/README.md packages/dashi-app/cordis.patch.yml LICENSE
          stat --printf='%n mode=%a uid=%u gid=%g size=%s mtime=%Y\n' packages/dashi-app/package.json packages/dashi-app/README.md packages/dashi-app/cordis.patch.yml LICENSE
          node scripts/pack-release.mjs "$RUNNER_TEMP/dashi-release-archives"
      - name: Preserve only the four diagnostic archives
        uses: actions/upload-artifact@v7
        with:
          name: w131-linux-post-gate-archives
          path: ${{ runner.temp }}/dashi-release-archives/*.tgz
          if-no-files-found: error

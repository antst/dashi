- id: system-prompt
  config:
    personaPrefix: >-
      You are dashi, a terminal coding agent powered by the {{model}} model.

- insert:
    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: standard

    - id: preset-standard
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: standard
        plugins:
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-present
            name: '@deepseek-ai/dsh-tool-present'

          - id: tool-ralph
            name: '@deepseek-ai/dsh-tool-ralph'

          - id: time-context
            name: '@deepseek-ai/dsh-time-context'

          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
              modelSelectionSettings: true

    - id: subagent-model-selection-settings
      name: '@deepseek-ai/dsh-tool-subagent/model-selection-settings'

    - id: workspace
      name: '@deepseek-ai/dsh-workspace'

    - id: file-uploads-none
      name: '@antst/dsh-file-uploads-none'

    - id: session-controller
      name: '@deepseek-ai/dsh-api-session-controller'

    - id: job-controller
      name: '@deepseek-ai/dsh-api-job-controller'

    - id: session-stats
      name: '@deepseek-ai/dsh-session-stats'

    - id: file-reference-local
      name: '@deepseek-ai/dsh-file-reference-local'

    - id: plugin-inventory
      name: '@deepseek-ai/dsh-host-plugin-inventory'

    - id: schedule
      name: '@deepseek-ai/dsh-schedule'

    - id: tool-schedule
      name: '@deepseek-ai/dsh-tool-schedule'

    - id: dashi
      name: '@antst/dashi'

    - id: sessionbus
      name: '@sessionbus/dsh'
      config: { product: dashi }

    - id: roller
      name: '@antst/roller'

- id: session-query-sqlite
  config:
    path: !!js dshHomePath('dashi-session-search.sqlite')
    openAt: first-search

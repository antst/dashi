- id: llm-deepseek
  disabled: true

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  config:
    root: !!js dshHomePath('replay-sessions')
    compression: none

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        file: !!js process.env.DSH_SNAPSHOT_FILE
        paceMs: 0
        providers:
          - id: w025-alpha
            name: Alpha
            models:
              - id: w025-unique
                name: Unique
                contextWindow: 100000
              - id: w025-shared
                name: Shared
                contextWindow: 100000
          - id: w025-beta
            name: Beta
            models:
              - id: w025-shared
                name: Shared
                contextWindow: 100000
